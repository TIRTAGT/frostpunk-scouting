name: Deploy scouting cheatsheet to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "export-web/**"
      - "schema.sql"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: frostpunk
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Install MySQL/MariaDB client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Download latest data dump
        run: curl -fL -o dump.sql "https://github.com/${{ github.repository }}/releases/latest/download/dump.sql"

      - name: Load data into database
        run: mysql -h 127.0.0.1 -u root -pci frostpunk < dump.sql

      - name: Generate static page
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: frostpunk
          DB_USER: root
          DB_PASSWORD: ci
          SITE_URL: https://tirtagt.github.io/frostpunk-scouting
        run: ./export-web/export.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: export-web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
